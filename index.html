<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Australian by Design – Home</title>
    <!-- Link to the shared stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- .app centres the content and limits it to phone width -->
    <div class="app">

      <!-- HEADER: appears on every page -->
      <header class="site-header">

        <!-- LOGO: was plain text "AUSTRALIAN BY DESIGN".
             Now a clickable image linking back to the home page.
             Save the logo image as: images/australian-by-design-logo.png
             Download from: https://www.australianbydesign.com.au/wp-content/uploads/2020/12/logo-hd.png -->
        <a class="logo-link" href="index.html">
          <img
            src="images/australian-by-design-logo.png"
            alt="Australian by Design logo"
            class="site-logo"
          />
        </a>

        <div class="header-actions">

          <!-- ACCOUNT ICON: was the letter "A".
               Now a simple person-silhouette SVG drawn directly in HTML.
               No icon library needed — it is just two shapes: a circle (head)
               and a curved path (body). stroke="currentColor" draws it in
               the same dark brown as the circular button. -->
          <button type="button" class="icon-btn" aria-label="Account">
            <svg class="account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </button>

          <!-- CART ICON: was the letter "C".
               Now a shopping-cart SVG drawn directly in HTML.
               No icon library needed — it is two small circles (wheels)
               and one path (basket). The badge number still appears in
               the top-right corner, exactly as before. -->
          <a href="cart.html" class="icon-btn" aria-label="Cart">
            <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span id="cart-badge" class="cart-count" style="display:none"></span>
          </a>

        </div>
      </header>

      <!-- HOME PAGE CONTENT -->

      <div class="browse-bar">Browse Categories</div>

      <!-- Search bar: not connected to a server, just visual for now -->
      <label class="visually-hidden" for="search-home">Search</label>
      <input
        id="search-home"
        class="search-input"
        type="search"
        placeholder="Search for gifts, jewelries and arts"
      />

      <!-- Category chips: clickable tags for browsing -->
      <div class="chips">
        <span class="chip">Jewelries</span>
        <span class="chip">Decorations</span>
        <span class="chip">Paintings</span>
      </div>

      <!-- Hero card: main banner with a "Shop now" link -->
      <div class="hero card">
        <h1>Handcrafted Australian gifts</h1>
        <p class="hero-text">
          Discover artisan-made pieces for meaningful gifting
        </p>
        <!-- "Shop now" is now a plain HTML link — no JavaScript needed -->
        <a href="listing.html" class="btn btn-primary">Shop now</a>
      </div>

      <!-- Hero banner image -->
      <img
        src="images/hero-gifts.jpg"
        alt="Handcrafted Australian gifts arranged on a table"
        class="hero-image product-img"
      />

      <h2 class="section-title">Featured Products</h2>

      <!-- Featured product 1: "View" links to product.html?id=0 -->
      <article class="product-row card">
        <img
          src="images/flora-koala.jpg"
          alt="Decoration Flora Koala"
          class="thumb product-img"
        />
        <div class="product-row-body">
          <h3 class="product-name">Decoration Flora Koala</h3>
          <p class="price">$15.00</p>
          <!-- ?id=0 tells product.html which product to show -->
          <a href="product.html?id=0" class="btn btn-outline">View</a>
        </div>
      </article>

      <!-- Featured product 2: "View" links to product.html?id=1 -->
      <article class="product-row card">
        <img
          src="images/flora-kangaroo.jpg"
          alt="Decoration Flora Kangaroo"
          class="thumb product-img"
        />
        <div class="product-row-body">
          <h3 class="product-name">Decoration Flora Kangaroo</h3>
          <p class="price">$15.00</p>
          <a href="product.html?id=1" class="btn btn-outline">View</a>
        </div>
      </article>

    </div><!-- end .app -->

    <!-- Toast notification (shown when item is added to cart) -->
    <div id="toast" class="toast"></div>

    <!-- Load the shared cart script -->
    <script src="cart.js"></script>
  </body>
</html>
